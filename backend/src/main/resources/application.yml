# =====================================================================
# EXCHANGE PRO backend configuration
# Every environment-specific or secret value comes from an environment
# variable. For local development, values are also read from the
# repository-root .env file (copy .env.example -> .env).
# No secret has a default value here.
# =====================================================================
spring:
  application:
    name: exchange-pro-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exchangepro}
    username: ${DB_USERNAME:exchangepro}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: exchangepro-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false            # no lazy loading from controllers/views - transactions stay in services
    hibernate:
      ddl-auto: validate           # schema is owned by Flyway; Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true             # /actuator/health/liveness and /actuator/health/readiness
  info:
    env:
      enabled: true

info:
  app:
    name: EXCHANGE PRO
    description: Multi-user stock exchange simulation (virtual funds only)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # %X{correlationId} is filled by CorrelationIdFilter for every HTTP request
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] [%X{correlationId:--}] %-40.40logger{39} : %m%n%wEx"
  level:
    root: INFO
    com.exchangepro: ${LOG_LEVEL_APP:INFO}

exchangepro:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  market-data:
    mode: ${MARKET_DATA_MODE:SIMULATION}
  security:
    jwt:
      secret: ${JWT_SECRET}                          # required, >= 32 characters, no default
      issuer: exchange-pro
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:P7D}
      cookie-name: ep_refresh
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  account:
    initial-balance: 100000.00                       # INR 1,00,000 virtual funds for every new account
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
